# このファイルは設定項目の例だけを示す。コピー先はOS標準の設定ディレクトリに置く。
# 利用者固有の絶対パス、APIキー、Cookie、tokenはGit管理しない。

# DB、生成物、入力cache、ログをまとめて保存するMyComfyUI専用ディレクトリ。
# data_root = "/absolute/path/to/MyComfyUI"

# 既存作品を読取り専用で取得するai-media参照API。未設定時は同梱fixtureを使う。
# aimedia_base_url = "http://127.0.0.1:8001"

# 参照API未提供時に検証用JSONを明示的に差し替える場合だけ指定する。
# aimedia_fixture_path = "/absolute/path/to/reference.json"

# prompt提案で作法と既存作品のpromptを読取り専用で参照するnovel-writerのルート。
# novel_writer_root = "/absolute/path/to/novel-writer"

# 外部画像Artifactの総保存量。既定は20GiB。
# external_image_import_quota_bytes = 21474836480

# 外部画像のpreview確認を確定できる有効期間。既定は15分。
# external_image_preview_ttl_seconds = 900
