[project]
name = "mycomfyui-api"
version = "0.1.0"
description = "MyComfyUI local Application API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  # 読み比較のカタカナ正規化に使う。torchを必要としないため、生成Backendの
  # Python環境を統合しない制約には当たらない。
  "fugashi>=1.3,<2",
  "httpx>=0.27,<1",
  # 外部画像をArtifact化する前に実デコードし、破損画像を拒否する。
  "pillow>=12.3,<13",
  "platformdirs>=4.3,<5",
  "pydantic-settings>=2.6,<3",
  # novel-writerの既存promptのYAMLを読む。uvicorn[standard]経由の推移的依存に
  # 任せると、extrasが変わったときに資産の参照が黙って止まる。
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  # 受信バイト数で本文を打ち切るRequestBodyLimitMiddlewareを使う。FastAPI経由の
  # 推移的依存に任せると、版が下がったときに保護が消える。
  "starlette>=1.6",
  "unidic-lite>=1.0.8,<2",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
]

[project.scripts]
mycomfyui-api = "mycomfyui_api.__main__:main"
mycomfyui-script-approve = "mycomfyui_api.script_approval_cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycomfyui_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
