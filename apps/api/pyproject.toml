[project]
name = "mycomfyui-api"
version = "0.1.0"
description = "MyComfyUI local Application API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "platformdirs>=4.3,<5",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycomfyui_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
