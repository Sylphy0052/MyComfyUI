[package]
name = "mycomfyui-desktop"
version = "0.1.0"
description = "MyComfyUI のデスクトップシェル"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-shell = "2.3"
# sidecar の標準出力の読み取りと health check の待ち合わせに使う。
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
# 初期化スクリプトへ埋め込む base URL のエスケープに使う。
serde_json = "1"
# 待ち受け先の検証で scheme と host を見る。
url = "2"
# data_root を Web 版の既定と同じ場所へ解決する。tauri が使う版へ揃えて重複を避ける。
dirs = "6"

[target.'cfg(windows)'.dependencies]
# PyInstallerの子プロセスを含めて停止するJob Objectの管理に使う。
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
# Tauri CLI が `tauri dev` で付ける既定の feature。
default = []
