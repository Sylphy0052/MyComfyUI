<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>MyComfyUI</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 24px;
        font-family: "Segoe UI", "Yu Gothic UI", system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.6;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      #message {
        margin: 0 0 16px;
      }
      #detail {
        margin: 0;
        padding: 12px;
        max-height: 220px;
        overflow: auto;
        border-radius: 6px;
        background: rgba(127, 127, 127, 0.14);
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #detail:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <p id="message"></p>
    <pre id="detail"></pre>
    <script>
      // 状態は URL の query で受け取る。読み込み前の eval は届かないため。
      const params = new URLSearchParams(location.search);
      const state = params.get("state");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const detail = document.getElementById("detail");

      if (state === "error") {
        // 詳細には sidecar の標準エラーが入る。textContent で入れてHTMLとして解釈させない。
        title.textContent = params.get("title") || "起動できません";
        message.textContent =
          "Application API を起動できませんでした。下の内容を確認してから起動し直してください。";
        detail.textContent = params.get("detail") || "";
      } else {
        title.textContent = "起動しています";
        message.textContent =
          "Application API の準備を待っています。初回はデータベースの作成に時間がかかります。";
        detail.textContent = "";
      }
    </script>
  </body>
</html>
